<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Population trend graph</title><desc id="desc">A graph showing two species over four sampling periods, with species X increasing and species Y decreasing.</desc><rect width="640" height="360" fill="#fff"/><path d="M80 300V45M80 300H600" stroke="#222" stroke-width="4"/><path d="M100 270 230 230 360 165 500 90" fill="none" stroke="#135" stroke-width="7"/><path d="M100 90 230 145 360 220 500 270" fill="none" stroke="#b24" stroke-width="7"/><text x="500" y="335" font-size="24">time</text><text x="15" y="70" font-size="24" transform="rotate(-90 15 70)">population</text><text x="510" y="90" font-size="23">X</text><text x="510" y="280" font-size="23">Y</text></svg>
