<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-labelledby="title desc">
<title id="title">Cell membrane transport diagram</title><desc id="desc">A cell boundary with particles outside and inside, and an arrow showing movement across the membrane.</desc>
<rect width="640" height="280" fill="#fff"/><rect x="35" y="45" width="570" height="190" rx="95" fill="#e8f5e9" stroke="#245" stroke-width="8"/><path d="M110 140h210" stroke="#245" stroke-width="6" marker-end="url(#a)"/><text x="80" y="90" font-size="24">higher concentration</text><text x="370" y="90" font-size="24">lower concentration</text><circle cx="95" cy="170" r="10" fill="#345"/><circle cx="130" cy="195" r="10" fill="#345"/><circle cx="500" cy="150" r="10" fill="#345"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 9 3 0 6z" fill="#245"/></marker></defs>
</svg>
