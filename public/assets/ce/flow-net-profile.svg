<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 240" role="img" aria-labelledby="title desc"><title id="title">Flow-net seepage geometry</title><desc id="desc">A soil embankment cross-section shows a head difference, four flow channels, twelve potential drops, and a three metre width.</desc><path d="M55 190L115 55H330L390 190Z" fill="none" stroke="#173b67" stroke-width="4"/><line x1="75" y1="175" x2="370" y2="175" stroke="#b42318" stroke-width="3"/><text x="175" y="215" font-family="sans-serif" font-size="17">width 3 m</text><text x="75" y="48" font-family="sans-serif" font-size="17">H=6 m</text><text x="145" y="95" font-family="sans-serif" font-size="16">Nf=4</text><text x="255" y="95" font-family="sans-serif" font-size="16">Nd=12</text><text x="150" y="35" font-family="sans-serif" font-size="16">k=2.0×10⁻⁵ m/s</text></svg>
