<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 240" role="img" aria-labelledby="title desc"><title id="title">Runoff hydrograph</title><desc id="desc">A runoff hydrograph plots discharge above a horizontal baseflow line at equal one-hour intervals.</desc><line x1="55" y1="195" x2="400" y2="195" stroke="#173b67" stroke-width="2"/><line x1="55" y1="35" x2="55" y2="195" stroke="#173b67" stroke-width="2"/><line x1="55" y1="155" x2="400" y2="155" stroke="#555" stroke-width="2" stroke-dasharray="6 5"/><polyline points="55,155 110,130 165,80 220,105 275,145 330,155 385,155" fill="none" stroke="#b42318" stroke-width="4"/><text x="300" y="150" font-family="sans-serif" font-size="16">baseflow</text><text x="45" y="30" font-family="sans-serif" font-size="16">Q</text><text x="370" y="220" font-family="sans-serif" font-size="16">time</text><text x="96" y="215" font-family="sans-serif" font-size="15">1 h</text><text x="151" y="215" font-family="sans-serif" font-size="15">2 h</text><text x="206" y="215" font-family="sans-serif" font-size="15">3 h</text></svg>
