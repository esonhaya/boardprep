<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 230" role="img" aria-labelledby="title desc"><title id="title">Hydraulic grade line</title><desc id="desc">A rising pipe profile is shown with a hydraulic grade line and centerline at sections A, B, and C.</desc><polyline points="45,175 155,150 270,120 395,90" fill="none" stroke="#173b67" stroke-width="5"/><polyline points="45,125 155,105 270,98 395,78" fill="none" stroke="#b42318" stroke-width="4"/><line x1="45" y1="125" x2="45" y2="175" stroke="#555" stroke-width="2" stroke-dasharray="5 5"/><line x1="155" y1="105" x2="155" y2="150" stroke="#555" stroke-width="2" stroke-dasharray="5 5"/><line x1="270" y1="98" x2="270" y2="120" stroke="#555" stroke-width="2" stroke-dasharray="5 5"/><text x="37" y="205" font-family="sans-serif" font-size="18">A</text><text x="147" y="180" font-family="sans-serif" font-size="18">B</text><text x="262" y="150" font-family="sans-serif" font-size="18">C</text><text x="300" y="72" font-family="sans-serif" font-size="16">HGL</text><text x="300" y="112" font-family="sans-serif" font-size="16">pipe</text></svg>
