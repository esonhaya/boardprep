<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 240" role="img" aria-labelledby="title desc"><title id="title">Lateral pressure geometry</title><desc id="desc">A retaining wall three metres high has a triangular lateral pressure diagram and a resultant force of ninety kilonewtons per metre.</desc><line x1="90" y1="35" x2="90" y2="195" stroke="#173b67" stroke-width="7"/><line x1="55" y1="195" x2="350" y2="195" stroke="#173b67" stroke-width="3"/><path d="M98 45 L300 195 L98 195 Z" fill="#dbeafe" stroke="#b42318" stroke-width="3"/><line x1="98" y1="45" x2="98" y2="195" stroke="#b42318" stroke-width="2" stroke-dasharray="5 5"/><text x="45" y="120" font-family="sans-serif" font-size="18">3 m</text><text x="305" y="190" font-family="sans-serif" font-size="16">90 kN/m</text><text x="120" y="220" font-family="sans-serif" font-size="16">triangular pressure</text></svg>
