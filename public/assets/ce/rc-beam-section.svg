<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" role="img" aria-labelledby="title desc"><title id="title">Reinforced concrete beam section</title><desc id="desc">A rectangular beam section has a top Zone A, a bottom Zone B, and a horizontal neutral-axis marker between them.</desc><rect x="90" y="25" width="180" height="160" fill="#eef4ff" stroke="#173b67" stroke-width="3"/><line x1="90" y1="105" x2="270" y2="105" stroke="#b42318" stroke-width="3" stroke-dasharray="8 6"/><text x="285" y="38" font-family="sans-serif" font-size="18">Zone A</text><text x="285" y="178" font-family="sans-serif" font-size="18">Zone B</text><text x="105" y="101" font-family="sans-serif" font-size="15" fill="#b42318">neutral axis</text><circle cx="115" cy="155" r="7" fill="#173b67"/><circle cx="140" cy="155" r="7" fill="#173b67"/></svg>
