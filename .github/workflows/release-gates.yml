name: Release gates

on:
  push:
    paths:
      - 'app/**'
      - 'config/**'
      - 'public/**'
      - 'storage/**'
      - 'tools/**'
      - 'docs/release-evidence/browser-workflows.json'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/release-gates.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'config/**'
      - 'public/**'
      - 'storage/**'
      - 'tools/**'
      - 'docs/release-evidence/browser-workflows.json'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/release-gates.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  doctor-release:
    name: Full Doctor release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # BrowserEvidenceService proves historical ancestry for registered runs.
          # A shallow checkout makes a valid documentation-only descendant look unrelated.
          fetch-depth: 0
          submodules: recursive

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: json, session, pdo_sqlite, mbstring, curl
          coverage: none

      - name: Record exact commit and run Doctor release
        id: doctor
        run: |
          evidence_dir="$RUNNER_TEMP/boardprep-release-gate-evidence/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/doctor-release"
          mkdir -p "$evidence_dir"
          printf '{"gate":"full_doctor_release","commit":"%s","run_id":"%s","run_attempt":"%s"}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$evidence_dir/manifest.json"
          set +e
          php -d memory_limit=1G tools/doctor.php --release --json > "$evidence_dir/doctor-release.json" 2>&1
          status=$?
          printf 'exit_code=%s\n' "$status" > "$evidence_dir/doctor-release.status"
          if [ "$status" -ne 0 ]; then
            summary=$(php -d memory_limit=256M -r '$d=json_decode((string)file_get_contents($argv[1]),true); if (!is_array($d)) { echo "doctor_summary_unavailable"; exit(0); } $r=$d["release_readiness"]??[]; $g=$r["release_gate"]??[]; $h=$d["health"]??[]; $hs=$h["summary"]??[]; $failed=[]; foreach (($r["release_domains"]??[]) as $name=>$domain) { if (is_array($domain) && strtoupper((string)($domain["status"]??""))==="FAIL") $failed[]=(string)$name; } printf("gate=%s decision=%s p0=%d health=%s health_fail=%d failed_domains=%s", $g["status"]??"UNKNOWN", $r["release_decision"]??"UNKNOWN", (int)($r["priority_counts"]["P0"]??0), $h["overall_status"]??"UNKNOWN", (int)($hs["fail_count"]??0), implode(",",$failed));' "$evidence_dir/doctor-release.json" 2>/dev/null || printf 'doctor_summary_unavailable')
            printf '::error file=.github/workflows/release-gates.yml,line=1,title=Doctor release result::%s\n' "$summary"
          fi
          exit "$status"

      - name: Upload Doctor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boardprep-doctor-release-${{ github.sha }}
          path: ${{ runner.temp }}/boardprep-release-gate-evidence/${{ github.run_id }}/${{ github.run_attempt }}/doctor-release/
          if-no-files-found: warn
          retention-days: 14

  security-privacy:
    name: Security/privacy — ${{ matrix.test_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - test_id: production-quiz-csrf
            test_path: tools/Tests/ProductionQuizCsrfTest.php
          - test_id: question-import-csrf
            test_path: tools/Tests/QuestionImportCsrfTest.php
          - test_id: question-import-safety
            test_path: tools/Tests/QuestionImportSafetyTest.php
          - test_id: anonymous-learner-privacy
            test_path: tools/Tests/AnonymousLearnerPrivacyHttpTest.php
          - test_id: session-configuration
            test_path: tools/Tests/SessionConfigurationTest.php
          - test_id: security-trust-boundary
            test_path: tools/Tests/SecurityTrustBoundaryTest.php
          - test_id: account-security
            test_path: tools/Tests/AccountSecurityTest.php
          - test_id: account-http-boundary
            test_path: tools/Tests/AccountHttpTest.php
          - test_id: account-lifecycle-json
            test_path: tools/Tests/AccountLifecycleJsonTest.php
          - test_id: account-lifecycle-sqlite
            test_path: tools/Tests/AccountLifecycleSqliteTest.php
          - test_id: account-deletion-cli
            test_path: tools/Tests/AccountDeletionCliTest.php
          - test_id: account-encrypted-backup-restore
            test_path: tools/Tests/AccountBackupTest.php
          - test_id: simulator-fixture-privacy
            test_path: tools/Tests/SimulationFixturePrivacyIsolationTest.php
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: json, session, pdo_sqlite, mbstring, sodium
          coverage: none

      - name: Run focused security and privacy test
        env:
          TEST_ID: ${{ matrix.test_id }}
          TEST_PATH: ${{ matrix.test_path }}
        run: |
          evidence_dir="$RUNNER_TEMP/boardprep-release-gate-evidence/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/security-privacy/$TEST_ID"
          mkdir -p "$evidence_dir"
          printf '{"gate":"security_privacy","test_id":"%s","test_path":"%s","commit":"%s","run_id":"%s","run_attempt":"%s"}\n' "$TEST_ID" "$TEST_PATH" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$evidence_dir/manifest.json"
          set +e
          php "$TEST_PATH" > "$evidence_dir/test.log" 2>&1
          status=$?
          cat "$evidence_dir/test.log"
          printf '%s exit_code=%s\n' "$TEST_ID" "$status" > "$evidence_dir/test.status"
          if [ "$status" -ne 0 ]; then
            reason=$(grep -E '^(PHP Fatal error:|Fatal error:|Parse error:|Uncaught (Error|TypeError|RuntimeException))' "$evidence_dir/test.log" | tail -n 1 | cut -c1-350 | tr '\r\n' ' ')
            if [ -z "$reason" ]; then reason='No sanitized PHP fatal or exception line was captured; inspect the run evidence artifact.'; fi
            reason=${reason//'%'/'%25'}
            reason=${reason//$'\r'/'%0D'}
            reason=${reason//$'\n'/'%0A'}
            printf '::error file=%s,line=1,title=Security/privacy regression failed::%s exited with code %s: %s\n' "$TEST_PATH" "$TEST_ID" "$status" "$reason"
          fi
          exit "$status"

      - name: Upload security and privacy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boardprep-security-privacy-${{ matrix.test_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/boardprep-release-gate-evidence/${{ github.run_id }}/${{ github.run_attempt }}/security-privacy/${{ matrix.test_id }}/
          if-no-files-found: warn
          retention-days: 14

  ten-board-http:
    name: Ten-board learner HTTP journey
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: json, session, pdo_sqlite, mbstring
          coverage: none

      - name: Run ten-board HTTP journey
        run: |
          evidence_dir="$RUNNER_TEMP/boardprep-release-gate-evidence/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/ten-board-http"
          mkdir -p "$evidence_dir"
          printf '{"gate":"ten_board_http","commit":"%s","run_id":"%s","run_attempt":"%s"}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$evidence_dir/manifest.json"
          set +e
          php tools/Tests/TenBoardLearnerJourneyHttpTest.php > "$evidence_dir/ten-board-http.log" 2>&1
          status=$?
          printf 'exit_code=%s\n' "$status" > "$evidence_dir/ten-board-http.status"
          exit "$status"

      - name: Upload ten-board HTTP evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boardprep-ten-board-http-${{ github.sha }}
          path: ${{ runner.temp }}/boardprep-release-gate-evidence/${{ github.run_id }}/${{ github.run_attempt }}/ten-board-http/
          if-no-files-found: warn
          retention-days: 14

  production-preflight:
    name: Production preflight and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: json, session, pdo_sqlite, mbstring
          coverage: none

      - name: Run preflight and smoke independently
        run: |
          evidence_dir="$RUNNER_TEMP/boardprep-release-gate-evidence/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/production-preflight"
          mkdir -p "$evidence_dir"
          printf '{"gate":"production_preflight_smoke","commit":"%s","run_id":"%s","run_attempt":"%s"}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$evidence_dir/manifest.json"
          failed=0
          set +e
          APP_ENV=production APP_DEBUG=false php tools/doctor.php --preflight --json > "$evidence_dir/production-preflight.json" 2>&1
          preflight_status=$?
          printf 'exit_code=%s\n' "$preflight_status" > "$evidence_dir/production-preflight.status"
          if [ "$preflight_status" -ne 0 ]; then failed=1; fi
          APP_ENV=production APP_DEBUG=false php tools/doctor.php --smoke --json > "$evidence_dir/production-smoke.json" 2>&1
          smoke_status=$?
          printf 'exit_code=%s\n' "$smoke_status" > "$evidence_dir/production-smoke.status"
          if [ "$smoke_status" -ne 0 ]; then failed=1; fi
          exit "$failed"

      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boardprep-production-preflight-${{ github.sha }}
          path: ${{ runner.temp }}/boardprep-release-gate-evidence/${{ github.run_id }}/${{ github.run_attempt }}/production-preflight/
          if-no-files-found: warn
          retention-days: 14

  product-readiness:
    name: Formal product readiness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # BrowserEvidenceService must prove commit ancestry; depth-1 cannot distinguish
          # a documentation-only descendant from missing history.
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: json, session, pdo_sqlite, mbstring
          coverage: none

      - name: Evaluate product readiness
        run: |
          evidence_dir="$RUNNER_TEMP/boardprep-release-gate-evidence/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/product-readiness"
          mkdir -p "$evidence_dir"
          printf '{"gate":"formal_product_readiness","commit":"%s","run_id":"%s","run_attempt":"%s"}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$evidence_dir/manifest.json"
          set +e
          php tools/product-readiness.php --json > "$evidence_dir/product-readiness.json" 2>&1
          status=$?
          printf 'exit_code=%s\n' "$status" > "$evidence_dir/product-readiness.status"
          if [ "$status" -ne 0 ]; then
            summary=$(php -r '$d=json_decode((string)file_get_contents($argv[1]),true); if (!is_array($d)) { echo "product_readiness_summary_unavailable"; exit(0); } printf("product_feature_complete=%s product_launch_ready=%s privacy_terms=%s incomplete_features=%d mandatory_evidence_not_passed=%d", !empty($d["product_feature_complete"])?"yes":"no", !empty($d["product_launch_ready"])?"yes":"no", !empty($d["privacy_owner_terms_configured"])?"yes":"no", count((array)($d["incomplete_in_scope_features"]??[])), count((array)($d["mandatory_evidence_not_passed"]??[])));' "$evidence_dir/product-readiness.json" 2>/dev/null || printf 'product_readiness_summary_unavailable')
            printf '::error file=.github/workflows/release-gates.yml,line=1,title=Product readiness remains blocked::%s\n' "$summary"
          fi
          exit "$status"

      - name: Upload product readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boardprep-product-readiness-${{ github.sha }}
          path: ${{ runner.temp }}/boardprep-release-gate-evidence/${{ github.run_id }}/${{ github.run_attempt }}/product-readiness/
          if-no-files-found: warn
          retention-days: 14
