name: Browser acceptance

on:
  push:
    paths:
      - 'app/**'
      - 'config/**'
      - 'public/**'
      - 'storage/**'
      - 'tests/**'
      - 'tools/**'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.*'
      - '.github/workflows/browser-acceptance.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'config/**'
      - 'public/**'
      - 'storage/**'
      - 'tests/**'
      - 'tools/**'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.*'
      - '.github/workflows/browser-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: json, session, pdo_sqlite
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser acceptance
        run: npm run test:browser

      - name: Summarize browser assertions
        if: always()
        run: node tools/summarize-browser-results.cjs

      - name: Collect browser evidence artifacts
        if: always()
        run: node tools/collect-browser-artifacts.cjs

      - name: Upload browser visual and diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boardprep-chromium-visual-qa
          path: |
            screenshots/
            visual-audit.md
            defect-register.md
            browser-results.json
            console-errors.txt
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
