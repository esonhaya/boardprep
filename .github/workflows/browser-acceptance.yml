name: Browser acceptance

on:
  push:
    paths:
      - 'app/**'
      - 'config/**'
      - 'public/**'
      - 'storage/**'
      - 'tests/**'
      - 'tools/**'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.*'
      - '.github/workflows/browser-acceptance.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'config/**'
      - 'public/**'
      - 'storage/**'
      - 'tests/**'
      - 'tools/**'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.*'
      - '.github/workflows/browser-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set isolated browser evidence directory
        run: |
          evidence_dir="$RUNNER_TEMP/boardprep-browser-evidence/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
          mkdir -p "$evidence_dir"
          printf 'BOARDPREP_BROWSER_EVIDENCE_DIR=%s\n' "$evidence_dir" >> "$GITHUB_ENV"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: json, session, pdo_sqlite, sodium
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify browser CI and evidence contracts
        run: npm run test:browser:contract

      - name: Run focused learner, privacy, and restore regressions
        run: |
          php tools/Tests/BackupManifestPathSafetyTest.php
          php tools/Tests/ProductionQuizCsrfTest.php
          php tools/Tests/AnonymousLearnerPrivacyHttpTest.php
          php tools/Tests/SessionConfigurationTest.php
          php tools/Tests/SecurityTrustBoundaryTest.php
          php tools/Tests/FlashcardControllerReadPathTest.php
          php tools/Tests/FlashcardHttpTest.php

      - name: Verify isolated learner storage fixture
        run: npm run test:browser:fixture

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify browser driver, executable, loopback, and shutdown
        shell: bash
        run: |
          set -o pipefail
          node tools/browser-preflight.cjs | tee "$BOARDPREP_BROWSER_EVIDENCE_DIR/browser-preflight.json"

      - name: Run browser acceptance
        run: npm run test:browser

      - name: Summarize browser assertions
        if: always()
        run: node tools/summarize-browser-results.cjs

      - name: Collect browser evidence artifacts
        if: always()
        run: node tools/collect-browser-artifacts.cjs

      - name: Write exact-SHA browser provenance
        if: always()
        run: node tools/write-browser-ci-manifest.cjs

      - name: Upload browser visual and diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boardprep-chromium-visual-qa
          path: ${{ env.BOARDPREP_BROWSER_EVIDENCE_DIR }}/
          if-no-files-found: ignore
          retention-days: 14
